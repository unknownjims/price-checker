name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Cordova
        run: |
          set -euo pipefail

          npm install -g cordova

          # Install platform-specific deps
          npm install -g cordova-android

          # Create Cordova project
          cordova create android-app com.pricechecker.app "Price Checker"
          cd android-app

          # Add Android platform with specific version that supports modern Gradle
          cordova platform add android@12.0.0

          # Clean www and copy app files
          rm -rf www/*
          cp ../price-checker-standalone.html www/index.html
          cp ../manifest.json www/
          cp ../service-worker.js www/
          cp ../icon-192.png www/ 2>/dev/null || true
          cp ../icon-512.png www/ 2>/dev/null || true

          # Set compileSdkVersion in build.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' platforms/android/cdv-gradle-name.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' platforms/android/app/build.gradle 2>/dev/null || true

          # Build debug APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Price-Checker-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
