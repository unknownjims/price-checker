name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          npm install -g cordova

          # Create project
          cordova create pc-app com.pricechecker.app "Price Checker"
          cd pc-app

          # Add android platform (use 11 which is more stable)
          cordova platform add android@11.0.0

          # Copy web files
          rm -rf www/*
          cp ../price-checker-standalone.html www/index.html
          cp ../manifest.json www/
          cp ../service-worker.js www/
          cp ../icon-192.png www/ 2>/dev/null || true
          cp ../icon-512.png www/ 2>/dev/null || true

          # Fix Gradle wrapper to use 8.7 (compatible version)
          mkdir -p platforms/android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> platforms/android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> platforms/android/gradle/wrapper/gradle-wrapper.properties

          # Patch compileSdkVersion in gradle files
          find platforms/android -name "*.gradle" -exec grep -l compileSdk {} \; 2>/dev/null | while read f; do
            sed -i 's/compileSdk [0-9]*/compileSdk 34/g' "$f" 2>/dev/null || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$f" 2>/dev/null || true
          done

          # Build debug APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Price-Checker-APK
          path: pc-app/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
