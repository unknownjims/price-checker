name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build APK via PWABuilder
        shell: bash
        run: |
          set -euo pipefail

          # Serve the PWA locally
          npm install -g serve
          serve -s . -l 8080 --no-clipboard &
          sleep 3
          echo "Server started, testing..."
          curl -s http://localhost:8080/manifest.json | head -5

          # Try PWABuilder's local APK generation
          npm install -g pwabuilder

          # Use the local pwabuilder CLI to generate APK
          mkdir -p output
          npx pwabuilder --url http://localhost:8080 --os android --output ./output 2>&1 | tail -30 || true

          # Check what was generated
          find ./output -type f -name "*.apk" 2>/dev/null || true
          find . -type f -name "*.apk" 2>/dev/null || true

          # Kill server
          kill %1 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Price-Checker-APK
          path: |
            ./output/*.apk
            ./*.apk
            pwabuilder/**/*.apk
          if-no-files-found: warn
